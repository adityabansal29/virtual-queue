<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Queue</title>
  <!-- D-02: config injected first so queue.js reads it on load -->
  <script>window.QUEUE_CONFIG = { apiBase: location.hostname === 'localhost' ? 'http://localhost:8080' : '__QUEUE_API_BASE__' };</script>
  <link rel="stylesheet" href="queue.css">
  <script src="queue.js" defer></script>
</head>
<body>
  <main>
    <p id="pos">Checking your position&#x2026;</p>
    <p id="wait"></p>
    <p id="status" aria-live="polite"></p>
    <div id="constrained">Queue paused &#x2014; waiting for capacity to free up.</div>
  </main>
</body>
</html>
